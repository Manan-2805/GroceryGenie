# Production deployment for app services only.
# Run infrastructure first: docker compose -f docker-compose.infra.yml up -d
# Then run: docker compose -f docker-compose.prod.yml up --build -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: grocergenie-backend-prod
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
      - ./uploads:/app/uploads
    env_file:
      - .env.prod
    networks:
      - grocergenie-network
    depends_on:
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: grocergenie-frontend-prod
    ports:
      - "80:80"
      - "5173:5173"
    env_file:
      - .env.prod
    networks:
      - grocergenie-network

networks:
  grocergenie-network:
    external: true
