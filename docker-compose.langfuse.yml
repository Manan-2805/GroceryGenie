version: '3.8'

services:
  langfuse-db:
    image: postgres:16-alpine
    container_name: langfuse-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: langfusepostgrespass
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse-server
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:langfusepostgrespass@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=my_nextauth_secret_must_be_long_and_secure_12345
      - NEXTAUTH_URL=http://localhost:3000
      - TELEMETRY_ENABLED=false
      - PORT=3000
    depends_on:
      langfuse-db:
        condition: service_healthy

volumes:
  langfuse_db_data:
