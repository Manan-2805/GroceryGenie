version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: grocergenie-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: grocergenie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d
    networks:
      - grocergenie-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grocergenie-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - grocergenie-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: grocergenie-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - grocergenie-network

  neo4j:
    image: neo4j:5-community
    container_name: grocergenie-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/grocergeniepass
      NEO4J_server_memory_pagecache_size: "128M"
      NEO4J_server_memory_heap_initial__size: "256M"
      NEO4J_server_memory_heap_max__size: "256M"
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - grocergenie-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "grocergeniepass", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse-server
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/langfuse
      - NEXTAUTH_SECRET=my_nextauth_secret_must_be_long_and_secure_12345
      - NEXTAUTH_URL=http://localhost:3000
      - TELEMETRY_ENABLED=false
      - PORT=3000
    networks:
      - grocergenie-network
    depends_on:
      db:
        condition: service_healthy

networks:
  grocergenie-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
