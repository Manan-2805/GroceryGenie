[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "fastapi>=0.138.2",
    "granian>=2.0.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langfuse<3.0.0",
    "mcp>=1.28.1",
    "neo4j>=6.2.0",
    "numpy>=2.4.6",
    "onnx-asr[hub]>=0.11.0; sys_platform == 'win32'",
    "onnx-asr[hub]>=0.11.0; sys_platform != 'win32'",
    "onnxruntime-directml>=1.24.4; sys_platform == 'win32'",
    "openai>=2.44.0",
    "pipecat-ai[silero]>=1.4.0",
    "piper-tts>=1.4.2",
    "pydantic-settings>=2.14.2",
    "pydub>=0.25.1",
    "python-json-logger>=4.1.0",
    "qdrant-client>=1.18.0",
    "redis>=8.0.1",
    "sentence-transformers>=5.6.0",
    "slowapi>=0.1.10",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
    "sqlalchemy>=2.0.51",
    "torch",
    "uvicorn[standard]>=0.49.0",
    "pyjwt[crypto]>=2.13.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.1.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
    "playwright",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "T20", "RET", "SIM", "ARG", "PTH", "ERA", "PL"]
ignore = ["E501", "PLR2004", "B008", "PLR0912", "PLR0915", "PLC0415", "PLW0603", "PLR0911", "PLR0913", "PTH"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
