[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "authlib>=1.9.1",
    "fastapi>=0.138.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "numpy>=2.4.6",
    "onnx-asr==0.11.0",
    "onnxruntime>=1.27,<2",
    "pillow>=13,<14",
    "python-multipart>=0.0.30",
    "piper-tts>=1.4.2",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.1.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7,<8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
    "playwright",
]

[tool.uv]
constraint-dependencies = [
    "certifi>=2026.10.18",
    "cryptography>=50.0.0",
    "filelock>=4.2.1",
    "joserfc>=1.7.6",
    "msgpack>=1.2.3",
    "pip>=26.2",
    "urllib3>=2.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "T20", "RET", "SIM", "ARG", "PTH", "ERA", "PL"]
ignore = ["E501", "PLR2004", "B008", "PLR0912", "PLR0915", "PLC0415", "PLW0603", "PLR0911", "PLR0913", "PTH", "ARG001"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: integration tests using a disposable PostgreSQL database",
    "e2e: end-to-end tests that require running backend/frontend services and browser",
]
addopts = "--ignore=tests/e2e"
