name: grocergenie
x-backend: &backend
  image: ${BACKEND_IMAGE:-grocergenie-backend:local}
  build:
    context: backend
    dockerfile: Dockerfile.prod
  environment:
    DATABASE_URL: postgresql+asyncpg://grocery:${POSTGRES_PASSWORD:?Set a URL-safe PostgreSQL password}@postgres:5432/grocergenie
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    ENV_MODE: ${ENV_MODE:-development}
    SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:?Set a strong session signing key}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/google/callback}
    LLM_PROVIDERS: ${LLM_PROVIDERS:-}
    ASR_MODEL: ${ASR_MODEL:-nemo-conformer-aed}
    ASR_SUBDIR: ${ASR_SUBDIR:-canary}
    ASR_QUANTIZATION: ${ASR_QUANTIZATION:-int8}
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe PostgreSQL password}
      POSTGRES_DB: grocergenie
    volumes:
      - grocery-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, grocery, -d, grocergenie]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 4g
    volumes:
      - grocery-uploads:/app/uploads
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10
  web:
    image: ${WEB_IMAGE:-grocergenie-web:local}
    build:
      context: frontend
      dockerfile: Dockerfile.prod
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  grocery-data:
  grocery-uploads:
